name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test synchronization automation
        run: python3 -m unittest discover -s tests -v

      - name: Validate generated Agent Skills
        run: python3 scripts/validate_skills.py skills

      - name: Verify generated artifact lock
        run: python3 scripts/verify_lock.py
